server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en el servicio "api" de la red de compose. Los timeouts van
    # holgados: operaciones administrativas (generación de catálogo, recálculos)
    # pueden superar los 60s default y un corte del proxy cancela el trabajo a
    # mitad de camino (incidente del 06/09/2026).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA: toda ruta desconocida cae en index.html (el router de Angular decide).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifest no deben cachearse agresivamente.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
}
