<header class="barra">
  <div class="marca">
    <span class="marca-icono">🛒</span>
    <span class="marca-nombre">SmartBuy</span>
  </div>

  <div class="sesion">
    @if (auth.usuario(); as usuario) {
      <a routerLink="/listas" class="sesion-nombre">Hola, {{ usuario.nombre }}</a>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" class="ingresar">Ingresar</a>
    }
  </div>

  <nav class="navegacion" aria-label="Secciones">
    @for (seccion of secciones; track seccion.ruta) {
      @if (seccion.disponible) {
        <a [routerLink]="seccion.ruta" routerLinkActive="activo" class="nav-item">
          {{ seccion.etiqueta }}
        </a>
      } @else {
        <span class="nav-item proximamente" [attr.aria-disabled]="true">
          {{ seccion.etiqueta }}
          <small>pronto</small>
        </span>
      }
    }
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
