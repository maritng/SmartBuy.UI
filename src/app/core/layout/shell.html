<header class="barra">
  <div class="marca">
    <svg class="marca-mono" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="var(--color-primario)" />
      <circle cx="50" cy="46" r="24" fill="#ffffff" />
      <circle cx="24" cy="42" r="8" fill="none" stroke="#ffffff" stroke-width="6" />
      <circle cx="76" cy="42" r="8" fill="none" stroke="#ffffff" stroke-width="6" />
      <ellipse cx="50" cy="52" rx="17" ry="13" fill="var(--color-primario)" />
      <circle cx="43" cy="47" r="2.8" fill="#ffffff" />
      <circle cx="57" cy="47" r="2.8" fill="#ffffff" />
      <path d="M42 58 q8 6 16 0" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" />
    </svg>
    <span class="marca-nombre"><span class="marca-chan">chan</span><span class="marca-go">go</span></span>
  </div>

  <div class="sesion">
    @if (auth.usuario(); as usuario) {
      <a routerLink="/listas" class="sesion-nombre">Hola, {{ usuario.nombre }}</a>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" class="ingresar">Ingresar</a>
    }
  </div>

  <nav class="navegacion" aria-label="Secciones">
    @for (seccion of secciones; track seccion.ruta) {
      @if (seccion.disponible) {
        <a [routerLink]="seccion.ruta" routerLinkActive="activo" class="nav-item">
          {{ seccion.etiqueta }}
        </a>
      } @else {
        <span class="nav-item proximamente" [attr.aria-disabled]="true">
          {{ seccion.etiqueta }}
          <small>pronto</small>
        </span>
      }
    }
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
