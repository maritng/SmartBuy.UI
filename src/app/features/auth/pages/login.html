<div class="tarjeta auth">
  <h1>Ingresar</h1>

  <form (submit)="$event.preventDefault(); ingresar()">
    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" [value]="email()" (input)="email.set($any($event.target).value)" required />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" [value]="password()" (input)="password.set($any($event.target).value)" required />
    </div>

    @if (errores().length > 0) {
      <div class="mensaje-error">
        @for (error of errores(); track error) {
          <p>{{ error }}</p>
        }
      </div>
    }

    <button type="submit" class="boton-principal" [disabled]="enviando() || !email().trim() || !password()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="alternativa">¿No tenés cuenta? <a routerLink="/registro">Creala acá</a></p>
</div>
